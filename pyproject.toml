[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openopc-shadow-adapter"
version = "1.0.0"
description = "Zero-modification Human-in-the-Loop adapter for OpenOPC's agentic DAG runtime. Park work items for human review. Resume execution automatically."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OpenOPC Shadow Team"},
]
keywords = [
    "openopc",
    "openopc-shadow-adapter",
    "human-in-the-loop",
    "hitl",
    "multi-agent",
    "agentic-workflow",
    "dag-orchestration",
    "llm-orchestration",
    "ai-native",
    "phase-state-machine",
    "external-agent-adapter",
    "autonomous-ai",
    "ai-oversight",
    "generative-ai",
    "agentic-ai",
    "fastapi",
    "react-portal",
    "human-oversight",
    "ai-company",
    "workflow-automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.19.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
opc = [
    "opc>=0.1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
    "httpx>=0.27.0",
    "coverage>=7.0",
]
all = [
    "openopc-shadow-adapter[opc,dev]",
]

[project.scripts]
shadow-serve = "shadow_adapter.api.app:main"
shadow-worker = "shadow_adapter.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["shadow_adapter"]
include = [
    "shadow_adapter/frontend/dist/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = ["E501", "E402", "B008", "BLE001", "B017"]
